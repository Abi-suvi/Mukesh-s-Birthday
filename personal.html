<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>Crystal Memory Portal ✨</title>

  <link rel="stylesheet" href="style.css">
</head>

<body>

  <div class="stars" aria-hidden="true"></div>

  <main class="container">

    <p class="eyebrow">✦ A LITTLE PLACE OF MEMORIES ✦</p>

    <h1>Crystal Memory Portal</h1>

    <p class="intro">
      Some moments deserve their own little universe.
    </p>

    <button
      class="portal"
      id="portal"
      type="button"
      aria-expanded="false"
      aria-controls="memoryCard"
    >

      <span class="orbit orbit-one"></span>
      <span class="orbit orbit-two"></span>

     <span class="butterfly-crystal">
  <span class="butterfly-wing wing-left">
    <span class="wing-facet"></span>
  </span>

  <span class="butterfly-wing wing-right">
    <span class="wing-facet"></span>
  </span>

  <span class="butterfly-wing wing-bottom-left">
    <span class="wing-facet"></span>
  </span>

  <span class="butterfly-wing wing-bottom-right">
    <span class="wing-facet"></span>
  </span>

  <span class="butterfly-body"></span>

  <span class="butterfly-antenna antenna-left"></span>
  <span class="butterfly-antenna antenna-right"></span>

  <span class="butterfly-sparkle sparkle-one">✧</span>
  <span class="butterfly-sparkle sparkle-two">✦</span>
  <span class="butterfly-sparkle sparkle-three">✧</span>
</span>

      <span class="tap-text">
        Touch the crystal to reveal the memories ✨
        <p class="reason-quote">
  “✨Ungalukkaaga Naan Ithellaam Pannathukku
  3 Mukkiyamaana Reasons Ithukkulla Thaan Irukku...
  Itha Touch Panni Therinjikkonga! 💖✨”
</p>
      </span>

    </button>

    <section class="memory-card" id="memoryCard" hidden>

      <div class="card-heading">
        <p class="card-label">✦ A LITTLE MEMORY COLLECTION ✦</p>

        <h2>Little Messages From You 💌</h2>

        <p class="card-subtitle">
          Some words become beautiful memories.
        </p>
      </div>

      <div class="image-frame">
        <img src="photos/personal.jpeg" alt="Personal memory card">
      </div>

      <p class="signature">
        Made with beautiful memories <span>♡</span>
      </p>

      <button class="close-button" id="closeCard" type="button">
        Close the memory ✦
      </button>

    </section>

    <p class="footer">
      A little universe, made with care ✨
    </p>

  </main>

  <script src="script.js"></script>
  <a href="secret.html" class="next-btn">Next →</a>

</body>
</html>
